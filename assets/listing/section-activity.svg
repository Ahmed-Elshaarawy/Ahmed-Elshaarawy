<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-label="On GitHub: One building per day of contributions.">
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.rise{animation:none}}
</style>
<rect width="840" height="120" rx="22" fill="#14213d"/>
<rect x="20" y="16" width="88" height="88" rx="22" fill="#fca311"/>
<g transform="translate(30 31) scale(.56)"><rect class="rise" style="animation-delay:0.0s" x="8" y="52" width="16" height="30" rx="3" fill="#14213d"/><rect class="rise" style="animation-delay:0.3s" x="30" y="30" width="16" height="52" rx="3" fill="#14213d"/><rect class="rise" style="animation-delay:0.6s" x="52" y="42" width="16" height="40" rx="3" fill="#14213d"/><rect class="rise" style="animation-delay:0.8999999999999999s" x="74" y="12" width="16" height="70" rx="3" fill="#14213d"/><rect class="rise" style="animation-delay:1.2s" x="96" y="24" width="16" height="58" rx="3" fill="#14213d"/></g>
<text x="132" y="44" class="f" font-size="12" font-weight="700" letter-spacing="1.8" fill="#fca311">ACTIVITY</text>
<text x="131" y="84" class="f" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1">On GitHub</text>
<text x="812" y="84" text-anchor="end" class="f" font-size="17" font-weight="500" fill="#9fb0d0">One building per day of contributions.</text>
</svg>