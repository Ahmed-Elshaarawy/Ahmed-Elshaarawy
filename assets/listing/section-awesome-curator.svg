<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-label="awesome-curator: Awesome lists that curate themselves.">
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.rise{animation:none}}
</style>
<rect width="840" height="120" rx="22" fill="#14213d"/>
<rect x="20" y="16" width="88" height="88" rx="22" fill="#fca311"/>
<g transform="translate(30 31) scale(.56)"><circle cx="18" cy="14" r="7" fill="#14213d"/><rect x="34" y="9" width="84" height="10" rx="5" fill="#14213d" opacity=".55"/><circle cx="18" cy="35" r="7" fill="#14213d"/><rect x="34" y="30" width="72" height="10" rx="5" fill="#14213d" opacity=".55"/><circle cx="18" cy="56" r="7" fill="#14213d"/><rect x="34" y="51" width="60" height="10" rx="5" fill="#14213d" opacity=".55"/><circle cx="18" cy="77" r="7" fill="#14213d"/><rect x="34" y="72" width="48" height="10" rx="5" fill="#14213d" opacity=".55"/></g>
<text x="132" y="44" class="f" font-size="12" font-weight="700" letter-spacing="1.8" fill="#fca311">OPEN SOURCE · PYTHON</text>
<text x="131" y="84" class="f" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1">awesome-curator</text>
<text x="812" y="84" text-anchor="end" class="f" font-size="17" font-weight="500" fill="#9fb0d0">Awesome lists that curate themselves.</text>
</svg>