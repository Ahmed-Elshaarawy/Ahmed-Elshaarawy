<text x="202" y="72" class="f" font-size="26" font-weight="700" letter-spacing="2" fill="#fca311">LIVE  ·  iOS  ·  ANDROID</text>
<text x="200" y="126" class="f" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Day Loop</text>
