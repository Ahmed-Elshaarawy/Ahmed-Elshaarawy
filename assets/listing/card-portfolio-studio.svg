<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="200" height="360" role="img" aria-label="Portfolio Studio: No-code portfolio builder">
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.rise{animation:none}}
</style>
<rect width="200" height="360" rx="24" fill="#14213d"/>
<text x="20" y="44" class="f" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9fb0d0">WEB · NEXT.JS</text>
<text x="20" y="74" class="f" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-.5"><tspan x="20" dy="0">Portfolio</tspan><tspan x="20" dy="26">Studio</tspan></text>
<g transform="translate(40 140)"><rect x="12" y="8" width="80" height="54" rx="7" fill="#14213d" stroke="#fca311" stroke-width="6"/><rect x="26" y="22" width="80" height="54" rx="7" fill="#14213d" stroke="#fca311" stroke-width="6"/><rect x="40" y="36" width="80" height="54" rx="7" fill="#14213d" stroke="#fca311" stroke-width="6"/></g>
<text x="20" y="300" class="f" font-size="13" font-weight="500" fill="#ffffff">No-code portfolio builder</text>
<rect x="20" y="316" width="64" height="24" rx="12" fill="#fca311"/>
<text x="52" y="333" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#14213d">VIEW</text>
</svg>