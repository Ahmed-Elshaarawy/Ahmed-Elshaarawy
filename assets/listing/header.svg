<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Ahmed Elshaarawy, Software Engineer and Machine Learning">
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.rise{animation:none}}
</style>
<rect width="840" height="330" rx="28" fill="#14213d"/>
<rect x="48" y="48" width="140" height="140" rx="34" fill="#fca311"/>
<g class="spin"><circle cx="118" cy="118" r="54" fill="none" stroke="#14213d" stroke-width="6" stroke-dasharray="250 90" stroke-linecap="round"/></g>
<text x="118" y="134" text-anchor="middle" class="f" font-size="44" font-weight="800" fill="#14213d" letter-spacing="-1">AE</text>
<text x="222" y="98" class="f" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Ahmed Elshaarawy</text>
<text x="224" y="134" class="f" font-size="21" font-weight="500" fill="#9fb0d0">Software Engineer · Machine Learning<tspan class="blink" fill="#fca311"> ▍</tspan></text>
<rect x="222" y="156" width="186" height="44" rx="22" fill="#fca311"/>
<text x="315" y="185" text-anchor="middle" class="f" font-size="17" font-weight="800" fill="#14213d" letter-spacing="1">GET IN TOUCH</text>
<text x="428" y="184" class="f" font-size="15" fill="#9fb0d0">Shipping on App Store · Google Play · Web</text>
<line x1="48" y1="232" x2="792" y2="232" stroke="#9fb0d0" stroke-opacity=".35"/>
<text x="141" y="276" text-anchor="middle" class="f" font-size="26" font-weight="800" fill="#ffffff">4</text><text x="141" y="300" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#9fb0d0" letter-spacing="1.6">PRODUCTS SHIPPED</text><line x1="234" y1="254" x2="234" y2="304" stroke="#9fb0d0" stroke-opacity=".35"/><text x="327" y="276" text-anchor="middle" class="f" font-size="26" font-weight="800" fill="#ffffff">2,893</text><text x="327" y="300" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#9fb0d0" letter-spacing="1.6">CONTRIBUTIONS / YR</text><line x1="420" y1="254" x2="420" y2="304" stroke="#9fb0d0" stroke-opacity=".35"/><text x="513" y="276" text-anchor="middle" class="f" font-size="26" font-weight="800" fill="#ffffff">5</text><text x="513" y="300" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#9fb0d0" letter-spacing="1.6">APP LANGUAGES</text><line x1="606" y1="254" x2="606" y2="304" stroke="#9fb0d0" stroke-opacity=".35"/><text x="699" y="276" text-anchor="middle" class="f" font-size="26" font-weight="800" fill="#ffffff">48h</text><text x="699" y="300" text-anchor="middle" class="f" font-size="11" font-weight="600" fill="#9fb0d0" letter-spacing="1.6">GAME JAM SHIP</text>
