<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 360" width="200" height="360" role="img" aria-label="awesome-curator: Self-curating lists">
<style>
.f{font-family:'Segoe UI Variable Display','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.blink{animation:blink 1.1s steps(1) infinite}
.rise{transform-box:fill-box;transform-origin:bottom;animation:rise 2.4s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes rise{from{transform:scaleY(.55)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.rise{animation:none}}
</style>
<rect width="200" height="360" rx="24" fill="#14213d"/>
<text x="20" y="44" class="f" font-size="12" font-weight="700" letter-spacing="1.6" fill="#9fb0d0">PYTHON · CI</text>
<text x="20" y="74" class="f" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-.5"><tspan x="20" dy="0">awesome-</tspan><tspan x="20" dy="26">curator</tspan></text>
<g transform="translate(40 140)"><circle cx="18" cy="14" r="7" fill="#fca311"/><rect x="34" y="9" width="84" height="10" rx="5" fill="#fca311" opacity=".55"/><circle cx="18" cy="35" r="7" fill="#fca311"/><rect x="34" y="30" width="72" height="10" rx="5" fill="#fca311" opacity=".55"/><circle cx="18" cy="56" r="7" fill="#fca311"/><rect x="34" y="51" width="60" height="10" rx="5" fill="#fca311" opacity=".55"/><circle cx="18" cy="77" r="7" fill="#fca311"/><rect x="34" y="72" width="48" height="10" rx="5" fill="#fca311" opacity=".55"/></g>
<text x="20" y="300" class="f" font-size="13" font-weight="500" fill="#ffffff">Self-curating lists</text>
<rect x="20" y="316" width="64" height="24" rx="12" fill="#fca311"/>
<text x="52" y="333" text-anchor="middle" class="f" font-size="11" font-weight="800" fill="#14213d">VIEW</text>
</svg>